# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  postgres_db:
    image: postgres:18-alpine
    container_name: gateway_postgres
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gw_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:8-alpine
    container_name: gateway_redis
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-default_secure_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - gw_redisdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:-default_secure_pass} ping | grep PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gw_pgdata:
  gw_redisdata:
